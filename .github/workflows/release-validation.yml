# Candidato local: valida el kit; no publica release ni despliega proyectos.
# No declarar este check obligatorio hasta probarlo en GitHub con casos negativos.
name: release-validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: release-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Instalar Gitleaks con SHA-256 verificado
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
      - name: Autoprueba negativa del detector de secretos
        shell: bash
        run: |
          test_dir=$(mktemp -d)
          python - "$test_dir/fixture.txt" <<'PY'
          import secrets
          import string
          import sys
          from pathlib import Path

          alphabet = string.ascii_letters + string.digits
          synthetic = "ghp_" + "".join(secrets.choice(alphabet) for _ in range(36))
          Path(sys.argv[1]).write_text("GITHUB_TOKEN=" + synthetic + "\n", encoding="utf-8")
          PY
          set +e
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir --redact --no-banner --log-level error "$test_dir"
          result=$?
          set -e
          if [ "$result" -ne 1 ]; then
            echo 'Gitleaks no bloqueó el caso sintético de prueba' >&2
            exit 1
          fi
      - name: Buscar secretos en historial y árbol actual
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact --no-banner --log-level warn .
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir --redact --no-banner --log-level warn .
      - name: Instalar validador JSON Schema
        run: python -m pip install -r requirements-release.txt
      - name: Auditar dependencias del kit
        run: |
          python -m pip install -r requirements-security.txt
          python -m pip_audit -r requirements-release.txt --strict --progress-spinner off --cache-dir "$RUNNER_TEMP/pip-audit-cache"
      - name: Validar candidato de release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python scripts/validate_release.py --base "$BASE_SHA"
          else
            python scripts/validate_release.py
          fi
      - name: Probar validador de proyectos
        run: python -m unittest discover -s tests -v
      - name: Lint de herramientas del kit
        run: python -m ruff check agpctl scripts tests
      - name: SAST Python del kit
        run: python -m bandit -r agpctl scripts -lll -q
